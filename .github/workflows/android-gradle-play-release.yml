name: Native Android CI, Internal Play Upload, and ODH Release Notice

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build a signed release AAB after protected-environment approval"
        required: true
        default: false
        type: boolean
      publish_to_play:
        description: "Upload the signed AAB to the internal Google Play track as a draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify native Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run lint, unit tests, and debug assembly
        run: |
          ./gradlew --no-daemon :app:lintDebug
          ./gradlew --no-daemon :app:testDebugUnitTest
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  signed_release:
    name: Build signed Android App Bundle
    needs: verify
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Restore upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          key_store_path="$RUNNER_TEMP/reimagined-telegram-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          chmod 600 "$key_store_path"
          echo "path=$key_store_path" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: reimagined-telegram-${{ github.ref_name }}.aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/reimagined-telegram-upload.jks"

  publish_internal_play_track:
    name: Upload signed AAB to Google Play internal testing
    needs: signed_release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_to_play == true &&
      needs.signed_release.result == 'success'
    runs-on: ubuntu-latest
    environment: play-internal
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key and Google Play service account
        id: release_credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$PLAY_SERVICE_ACCOUNT_JSON_BASE64"

          key_store_path="$RUNNER_TEMP/reimagined-telegram-upload.jks"
          play_credentials_path="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$play_credentials_path"
          chmod 600 "$key_store_path" "$play_credentials_path"
          echo "keystore_path=$key_store_path" >> "$GITHUB_OUTPUT"
          echo "play_credentials_path=$play_credentials_path" >> "$GITHUB_OUTPUT"

      - name: Confirm Google Play Publisher task is configured
        run: |
          set -euo pipefail
          if ! ./gradlew --no-daemon tasks --group publishing | grep -q "publishReleaseBundle"; then
            echo "Gradle Play Publisher is not configured. Add the plugin and the restricted internal-track play block before enabling this upload."
            exit 1
          fi

      - name: Upload AAB to Google Play internal testing as draft
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.release_credentials.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ steps.release_credentials.outputs.play_credentials_path }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:bundleRelease
          ./gradlew --no-daemon :app:publishReleaseBundle \
            --artifact-dir app/build/outputs/bundle/release

      - name: Remove temporary release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/reimagined-telegram-upload.jks"
          rm -f "$RUNNER_TEMP/google-play-service-account.json"

  notify_odh_channel_success:
    name: Notify ODH Channel of successful internal upload
    needs: publish_internal_play_track
    if: ${{ needs.publish_internal_play_track.result == 'success' }}
    runs-on: ubuntu-latest
    environment: play-internal
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Post public-safe success message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@oghenekumejohn"
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          text="ODH Android update has been uploaded to internal testing. Distribution remains limited to approved testers while release checks continue."

          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true"
